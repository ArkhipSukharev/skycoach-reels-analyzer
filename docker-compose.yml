name: skycoach-reels

x-app: &app
  build:
    context: .
    network: host
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://skycoach:skycoach@db:5432/skycoach
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skycoach
      POSTGRES_PASSWORD: skycoach
      POSTGRES_DB: skycoach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skycoach"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    volumes:
      - workdata:/tmp/skycoach

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  workdata:

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.18.0.0/16
        - subnet: fd00:5c7c:0:1::/64

